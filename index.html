<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>baeck-fitness-tracker v1.7</title>
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <h1>baeck-fitness-tracker v1.7</h1>
    <p>Sign in with an authorized Google account to continue.</p>
    <div id="googleSignInButton"></div>
    <div id="authError" class="auth-error"></div>
    <button id="authRetryBtn" class="auth-retry-btn" type="button" hidden>Retry</button>
  </div>
</div>

<div id="appRoot" class="app-root" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <h1><span class="title-full">baeck-fitness-tracker v1.7</span><span class="title-short">fitness-tracker</span></h1>
      <span id="userEmail" class="user-email"></span>
    </div>
    <div class="topbar-right">
      <span id="syncStatus" class="sync-status" title="Sync status"></span>
      <button id="signOutBtn" class="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="week">This Week</button>
    <button class="tab" data-view="history">Past Weeks</button>
    <button class="tab" data-view="monthly">Monthly</button>
  </nav>

  <main id="app"></main>

  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-topbar">
      <button id="settingsBackBtn" class="settings-back-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <h1>Training Settings</h1>
    </div>
    <div id="settingsBody" class="settings-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
