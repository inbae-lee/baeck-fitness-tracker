<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LapLog</title>
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>LapLog</h1>
  <span id="syncStatus" class="sync-status" title="Sync status"></span>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-view="week">This Week</button>
  <button class="tab" data-view="history">History</button>
  <button class="tab" data-view="monthly">Monthly</button>
</nav>

<main id="app"></main>

<template id="tpl-counter-row">
  <div class="row counter-row">
    <div class="row-label">
      <span class="row-title"></span>
      <span class="row-unit"></span>
    </div>
    <div class="row-control">
      <button class="btn-step minus" aria-label="Decrease">−</button>
      <span class="count-value">0</span>
      <button class="btn-step plus" aria-label="Increase">+</button>
    </div>
    <div class="row-flag"></div>
  </div>
</template>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
